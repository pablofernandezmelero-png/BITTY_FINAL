name: Build Android APK

# Se ejecuta a mano: GitHub -> Actions -> "Build Android APK" -> Run workflow.
# Al terminar, la APK de depuracion se descarga desde "Artifacts".
#
# Si marcas "publish_release", ademas publica la APK en una Release publica de GitHub (etiqueta build-N) y la pagina
# /descargar/ y el aviso de actualizacion de la app la ofreceran como ultima version. Por defecto NO publica nada.
# OJO: la APK de depuracion se firma con una clave que GitHub genera distinta en cada ejecucion: Android no deja
# actualizar encima de una APK anterior (hay que desinstalar la vieja). Para actualizar encima usa "Build Android Release (firmado)".
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar la APK en una Release publica (la pagina /descargar/ y el aviso de la app la ofreceran)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas (preguntas, flujo del juego y nube)
        run: npm test

      - name: Sincronizar la web con Android
        run: npx cap sync android

      - name: Compilar APK de depuracion
        working-directory: android
        env:
          BITTY_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Comprobar que existe la APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir la APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar la APK en una Release publica (solo si lo pediste)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bitty.apk
          # Version preliminar y NUNCA «latest»: la pagina /descargar/ y el aviso de la app solo ofrecen la ultima APK FIRMADA
          # (workflow "Build Android Release (firmado)"), no una de depuracion.
          gh release create "build-$RUN_NUMBER" Bitty.apk --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Bitty build $RUN_NUMBER (APK de prueba, sin firma propia)" \
            --notes "APK de DEPURACION de Bitty, compilacion $RUN_NUMBER, commit $GITHUB_SHA. Solo para pruebas: firmada con una clave de depuracion distinta en cada compilacion (hay que desinstalar la anterior para instalarla). La version oficial es la firmada."
