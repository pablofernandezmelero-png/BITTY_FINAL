name: Publicar web (GitHub Pages)

# Publica www/ en https://<usuario>.github.io/BITTY_FINAL/ cada vez que cambia la web en main.
# Requiere: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          npm ci
          npm test

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
