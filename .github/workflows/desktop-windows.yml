name: Build Bitty Desktop (Windows)

# Se ejecuta a mano: GitHub -> Actions -> "Build Bitty Desktop (Windows)" -> Run workflow.
# Genera el instalador de Windows (NSIS, sin firmar) a partir de la web actual (www/), tras comprobar la seguridad
# y arrancar la app de verdad con Electron (comprobación automática con la ventana oculta).
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar el instalador en la Release publica 'desktop-latest' (la pagina /descargar/ lo ofrecera)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Instalar dependencias de la web y ejecutar sus pruebas de escritorio
        run: |
          npm ci
          node tests/static.test.js
          node tests/desktop.test.js

      - name: Instalar dependencias de escritorio (Electron, electron-builder)
        working-directory: desktop
        run: npm ci

      - name: Comprobar la app con Electron real (ventana oculta)
        working-directory: desktop
        run: npm run smoke

      - name: Generar el instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --config.extraMetadata.version=1.0.${{ github.run_number }}

      - name: Comprobar que existe el instalador
        shell: bash
        run: test -f "desktop/dist/Bitty-Setup-1.0.${{ github.run_number }}.exe"

      - name: Subir el instalador como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitty-Windows-Installer
          path: desktop/dist/Bitty-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar el instalador en la Release desktop-latest (solo si lo pediste)
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp desktop/dist/Bitty-Setup-*.exe Bitty-Setup.exe
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --latest=false --title "Bitty para Windows (ultimo instalador)" --notes "Ultimo instalador de Windows de Bitty (sin firmar). Se reemplaza en cada publicacion."
          gh release upload desktop-latest Bitty-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
          # El titulo lleva el numero de compilacion: la app de escritorio lo lee para avisar de una version nueva.
          gh release edit desktop-latest --repo "$GITHUB_REPOSITORY" --title "Bitty para Windows (build $RUN_NUMBER)" --latest=false
