<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">

<style>
:root{--bg:#f4f3ff;--fg:#241b5c;--mut:#665f92;--card:#fff;--line:#e3e0f5;--pri:#6d4aff;--pri2:#ff4d8d;--bad:#c02d2d}
@media(prefers-color-scheme:dark){:root{--bg:#140e2a;--fg:#f5f0ff;--mut:#a79bd0;--card:#221a44;--line:#3a2d6b;--bad:#fca5a5}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:600 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background-image:radial-gradient(60vmax 60vmax at -10% -10%,rgba(109,74,255,.22),transparent 60%),radial-gradient(55vmax 55vmax at 110% 30%,rgba(255,77,141,.18),transparent 60%)}
main{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header img{width:56px;height:56px;border-radius:14px}
h1{margin:0;font-size:26px}
.sub{color:var(--mut);margin:0 0 14px}
.lang{display:flex;gap:6px;margin:0 0 14px}
.lang button{font:inherit;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:5px 10px;cursor:pointer}
.lang button[aria-pressed=true]{border-color:var(--pri);color:var(--pri)}
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:18px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:19px}
.card p{margin:0 0 10px;color:var(--mut);font-size:15px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#6d4aff,#ff4d8d);border:0;border-radius:16px;padding:13px 16px;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;width:100%}
.btn.sec{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.meta{font-size:13px;color:var(--mut);margin-top:8px}
.err{color:var(--bad)}
ol{margin:0 0 6px;padding-left:20px;color:var(--mut);font-size:15px}
a:focus-visible,button:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
</style>
</head>
<body>
<main>
<header><img src="../icons/icon-192.png" alt="" width="56" height="56"><h1 id="h1"></h1></header>
<p class="sub" id="sub"></p>
<div class="lang" role="group" aria-label="Idioma / Language / Taal"><button data-l="es">Español</button><button data-l="en">English</button><button data-l="nl">Nederlands</button></div>

<section class="card" id="cA" aria-live="polite"><h2 id="tA"></h2><p id="dA"></p><div id="bA"></div><div class="meta" id="mA"></div></section>
<section class="card" id="cW" aria-live="polite"><h2 id="tW"></h2><p id="dW"></p><div id="bW"></div><div class="meta" id="mW"></div></section>
<section class="card"><h2 id="tI"></h2><p id="dI"></p><ol id="oI"></ol><a class="btn sec" id="bI" href="../"></a></section>
<section class="card"><h2 id="tB"></h2><p id="dB"></p><a class="btn sec" id="bB" href="../"></a></section>
<p class="meta" id="nt"></p>
</main>
