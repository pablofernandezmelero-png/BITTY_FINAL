name: Build Android APK

# Se ejecuta a mano: GitHub -> Actions -> "Build Android APK" -> Run workflow.
# Al terminar, la APK de depuracion se descarga desde "Artifacts".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas (preguntas, flujo del juego y nube)
        run: npm test

      - name: Sincronizar la web con Android
        run: npx cap sync android

      - name: Compilar APK de depuracion
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Comprobar que existe la APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir la APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bitty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
