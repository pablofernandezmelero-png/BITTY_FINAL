:root{--bg:#f4f3ff;--fg:#241b5c;--mut:#7b76a8;--card:#fff;--line:#e3e0f5;--pri:#6d4aff;--pri2:#ff4d8d;--ok:#58cc02;--okb:#e4f8cc;--okt:#3d8c00;--bad:#ff4b4b;--badb:#ffe3e3;--badt:#d33a3a;--gold:#ffc800}

.chc{color:#fff!important;border-color:transparent!important;box-shadow:0 5px 0 rgba(0,0,0,.22)}

.chc.w{background:linear-gradient(135deg,#6d4aff,#c23bff)}
.chc .sm{font-size:13px;opacity:.95;margin-top:2px}
.chc:disabled{opacity:.62;filter:grayscale(.35);cursor:default}
.chc:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.lg button{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px}
.flag{width:28px;height:28px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.2);flex:none;display:inline-block;line-height:0}
.flag svg{width:100%;height:100%;display:block}
.lg button.a .flag{box-shadow:0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.25)}
code{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.95em}
/* Accesibilidad: contraste AA en textos secundarios/estados, botón legible en modo oscuro y foco visible con teclado */
:root{--mut:#665f92;--okt:#306f00;--badt:#c02d2d;--btn1:var(--pri)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--okt:#86efac;--badt:#fca5a5;--btn1:#7655ee}}
:root[data-theme="dark"]{--okt:#86efac;--badt:#fca5a5;--btn1:#7655ee}
button:focus-visible,.chip:focus-visible,a:focus-visible,.opt:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.inp:focus-visible{outline:3px solid var(--pri2);outline-offset:1px}

async function updCheck(){

  const r=await fetch(UPD.api,{headers:{Accept:"application/vnd.github+json"},credentials:"omit",referrerPolicy:"no-referrer",signal:c.signal});clearTimeout(to);

 }catch(e){}}
